# nodes_monitor configuration template (committed; placeholder values only, no real data).
#
# The real configuration lives at .data/nodes_monitor/config.toml (gitignored)
# and takes precedence over this template. Copy this file there and fill in the
# real values for your cluster. Parsed via embedded python (tomllib); python3 >= 3.11.

[ssh]
# Path to the SSH private key used to reach the nodes, RELATIVE TO
# [paths] workspace_root. The tools run on the host, so the ssh client reads
# the key at <workspace_root>/<identity>; a command running on a node sees the
# same file at /workspace/<identity>.
# Permissions are enforced to 0600 automatically at startup if too open.
identity = "./cluster_ssh_key"
port = 2222

[paths]
# HOST-side path of the workspace directory that is mounted at /workspace
# inside the container and on the compute nodes reached over ssh — i.e.
#   <workspace_root>/UTILS/nodes_monitor/utils/...  (this host)
#   /workspace/UTILS/nodes_monitor/utils/...        (container / node)
# must name the same files. The node-side mount point (/workspace) is fixed by
# the docker deployment.
workspace_root = "/path/to/host/workspace"
# Launcher script path AS SEEN ON A NODE (absolute; used under docker exec on
# the local node and over ssh on the remote ones). Defaults to
# /workspace/UTILS/nodes_monitor/utils/run_train.sh.
# launcher_host = "/workspace/UTILS/nodes_monitor/utils/run_train.sh"

[env]
# Name of the docker container on the local node (used via `docker exec`).
container = "your-container-name"

[trainer]
# Marker that uniquely tags OUR trainer processes. `release` kills only
# processes carrying this marker; `kill` kills everything nvidia-smi lists.
marker = "__UTILS_train_job__"
# pgrep/pkill pattern for TRAIN detection: a POSIX extended regex, used with
# pgrep -f / pkill -f. When SET it overrides the derivation from `marker` — so
# a user who changes only `marker` silently breaks BOTH trainer detection AND
# the exit-cleanup pkill (trainers left running on nodes). Leave this unset:
# the default derivation brackets the marker's first character (e.g.
# [_]_UTILS_train_job__) so pgrep/pkill never match their own command line.
# Only set this for a genuinely custom pattern.
# pgrep_pattern = "[U]TILS_train_job"
# Optional env-activation PREFIX for launching the occupancy workload, used when
# the workload needs a specific environment. run_train.sh is ALWAYS the launcher
# — it locates train.py relative to itself, so NO train.py path appears here.
# The launcher injects the marker via TRAIN_TAG. Example:
# command = "source /opt/conda/etc/profile.d/conda.sh && conda activate ENV &&"
# Optional env-activation PREFIX for the CUDA health probe (the IDLE-vs-BROKEN
# gate). The probe script path is derived from the node-side workspace mount
# point (/workspace), never hardcoded.
# Set this when torch is only importable inside a conda env, e.g.
# probe_command = "source /opt/conda/etc/profile.d/conda.sh && conda activate ENV &&"

[monitor]
# Optional tuning; the values below are the defaults.
# interval = 5
# cooldown = 43200
#   Trust window for cached confirmed-BROKEN CUDA probe verdicts. The probe
#   runs once per GPU-bearing node on each view.sh call, including occupied
#   nodes; a confirmed BROKEN result takes precedence over USED. Healthy and
#   inconclusive results are not trusted across calls and are probed again.
#   To force a fresh verdict for one node, delete its cache file:
#   ${TMPDIR:-/tmp}/utils_monitor_probe-<uid>/<ip>
# compute_threshold = 0
# mem_used_threshold = 100
# log_file = "/tmp/utils_train.log"

[ui]
# Workbench theme: table | icons | dashboard | status | neon | matrix | graph |
#                   cards | waves | weather | mono
theme = "table"

[nodes]
# Either an inline list (takes precedence) ...
# list = ["10.0.0.1", "10.0.0.2:2200"]
# ... or a redirect to a file with one IP[:port] per line ('#' comments allowed),
# resolved relative to the UTILS root when not absolute. A per-node :port
# overrides [ssh].port for that node.
# file = ".data/nodes_monitor/nodes.conf"
